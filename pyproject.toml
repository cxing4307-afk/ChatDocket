[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatdocket"
version = "0.1.0"
description = "Turn chat screenshots into a printable, paginated PDF."
requires-python = ">=3.10"
dependencies = [
  "Pillow==10.2.0",
  "reportlab==5.0.1",
]

[project.scripts]
chatdocket = "chatdocket.server:main"

[tool.setuptools.package-data]
chatdocket = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
